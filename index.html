<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EA">
<title>우리집 루틴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F2EA;          /* 쌀뜨물 같은 배경 */
    --card:#FFFFFF;
    --ink:#3A3830;
    --muted:#8E897B;
    --line:#E7E2D5;
    --green:#4C7A5A;       /* 완료 - 잎사귀 초록 */
    --green-deep:#3E664B;
    --honey:#F0C069;       /* 내일로 - 꿀색 */
    --honey-deep:#D9A54A;
    --taupe:#D9CDB8;       /* 다음 주로 - 모래색 */
    --taupe-deep:#C4B599;
    --coral:#E07856;       /* 밀림 배지 */
    --coral-bg:#FBE9E2;
    --radius:18px;
    --shadow:0 2px 10px rgba(90,80,60,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard',-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif;
    font-size:16px;
    line-height:1.5;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
  }
  .disp{font-family:'Gowun Dodum',sans-serif}

  /* ===== 헤더 ===== */
  header{padding:22px 20px 10px}
  header .date{font-size:14px;color:var(--muted);margin-bottom:2px}
  header h1{font-size:24px;font-weight:400;letter-spacing:-.3px}
  header h1 b{font-weight:400;color:var(--green)}

  main{padding:8px 16px 24px;max-width:560px;margin:0 auto}

  /* ===== 카드 ===== */
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px 16px 14px;
    margin-bottom:14px;
    animation:rise .25s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.card{animation:none}}

  .card .top{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
  .card .name{font-size:18px;font-weight:600;flex:1;word-break:keep-all}
  .badge-cat{
    font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap;
    background:#EFEBDF;color:#7A7461;
  }
  .badge-cat[data-c="식물"]{background:#E4F0E3;color:#4C7A5A}
  .badge-cat[data-c="반려동물"]{background:#FBEEDC;color:#B07B2E}
  .badge-cat[data-c="건강"]{background:#E4EDF4;color:#4A7391}
  .badge-cat[data-c="집안일"]{background:#F0E9F4;color:#7B5E92}
  .badge-late{
    display:inline-flex;align-items:center;
    font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;
    background:var(--coral-bg);color:var(--coral);white-space:nowrap;
  }
  .card .cycle{font-size:13px;color:var(--muted);margin-top:-8px;margin-bottom:12px}

  .btnrow{display:flex;gap:8px}
  .btnrow button{
    flex:1;
    min-height:52px;
    border:none;border-radius:14px;
    font-size:15px;font-weight:700;
    cursor:pointer;
    transition:transform .08s ease,filter .15s;
    font-family:inherit;
  }
  .btnrow button:active{transform:scale(.96)}
  .b-done{background:var(--green);color:#fff}
  .b-done:active{background:var(--green-deep)}
  .b-tmrw{background:var(--honey);color:#5C4715}
  .b-tmrw:active{background:var(--honey-deep)}
  .b-week{background:var(--taupe);color:#5B5340}
  .b-week:active{background:var(--taupe-deep)}

  /* ===== 빈 상태 ===== */
  .empty{text-align:center;padding:64px 20px;color:var(--muted)}
  .empty .big{font-size:44px;margin-bottom:14px}
  .empty .msg{font-size:19px;color:var(--ink)}
  .empty .sub{font-size:14px;margin-top:6px}

  /* ===== 스켈레톤 ===== */
  .skel{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px 16px;margin-bottom:14px;
  }
  .skel .bar{
    height:16px;border-radius:8px;margin-bottom:12px;
    background:linear-gradient(90deg,#EFEBE0 25%,#F7F4EC 50%,#EFEBE0 75%);
    background-size:200% 100%;
    animation:shimmer 1.3s infinite;
  }
  .skel .bar.w60{width:60%}
  .skel .bar.tall{height:48px;margin-bottom:0}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

  /* ===== 예정 화면 ===== */
  .day-head{display:flex;align-items:baseline;gap:8px;margin:20px 4px 10px}
  .day-head .d{font-size:16px;font-weight:700}
  .day-head .rel{font-size:13px;color:var(--muted)}
  .up-item{
    background:var(--card);border-radius:14px;box-shadow:var(--shadow);
    padding:14px 16px;margin-bottom:8px;
    display:flex;align-items:center;gap:10px;
  }
  .up-item .nm{flex:1;font-weight:600}
  .day-none{font-size:14px;color:var(--muted);padding:4px 6px 2px}

  /* ===== 관리 화면 ===== */
  .add-btn{
    width:100%;min-height:56px;border:2px dashed #CFC8B4;border-radius:var(--radius);
    background:transparent;color:#8A8266;font-size:16px;font-weight:700;
    cursor:pointer;margin-bottom:16px;font-family:inherit;
  }
  .add-btn:active{background:#EFEBDF}
  .mg-item{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;margin-bottom:12px;
  }
  .mg-item .row1{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .mg-item .nm{font-size:17px;font-weight:600;flex:1}
  .mg-item .info{font-size:13px;color:var(--muted);margin-bottom:12px}
  .mg-item .acts{display:flex;gap:8px}
  .mg-item .acts button{
    flex:1;min-height:44px;border:none;border-radius:12px;
    font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .b-edit{background:#EFEBDF;color:#6B6450}
  .b-del{background:#FBE9E2;color:var(--coral)}

  /* ===== 카테고리 관리 ===== */
  .sec-title{
    font-size:15px;font-weight:700;color:#6B6450;
    margin:26px 4px 10px;
  }
  .cat-box{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;
  }
  .cat-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .cat-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:#EFEBDF;color:#6B6450;
    font-size:14px;font-weight:600;
    padding:8px 8px 8px 14px;border-radius:999px;
  }
  .cat-chip button{
    width:26px;height:26px;border:none;border-radius:50%;
    background:#E0D9C6;color:#8A8266;font-size:15px;font-weight:700;
    cursor:pointer;line-height:1;font-family:inherit;
  }
  .cat-chip button:active{background:var(--coral-bg);color:var(--coral)}
  .cat-add{display:flex;gap:8px}
  .cat-add input{
    flex:1;min-height:48px;padding:0 14px;
    border:1.5px solid var(--line);border-radius:14px;
    font-size:15px;background:#fff;color:var(--ink);font-family:inherit;
  }
  .cat-add input:focus{outline:2px solid var(--green);border-color:transparent}
  .cat-add button{
    min-height:48px;padding:0 20px;border:none;border-radius:14px;
    background:var(--green);color:#fff;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }

  /* ===== 음식 화면 ===== */
  .food-form{display:flex;flex-direction:column;gap:8px}
  .food-form input{
    min-height:48px;padding:0 14px;
    border:1.5px solid var(--line);border-radius:14px;
    font-size:15px;background:#fff;color:var(--ink);font-family:inherit;
  }
  .food-form input:focus{outline:2px solid var(--green);border-color:transparent}
  .food-row{display:flex;gap:8px}
  .food-row .grow{flex:1;min-width:0}
  .food-qty{width:86px;text-align:center}
  .food-hint{font-size:12px;color:var(--muted);padding:0 4px}
  .qty-badge{
    font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:#EAF1EA;color:var(--green);margin-left:6px;vertical-align:1px;white-space:nowrap;
  }
  .food-form button{
    min-height:50px;border:none;border-radius:14px;
    background:var(--green);color:#fff;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }
  .dd{
    font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;
    background:#EFEBDF;color:#7A7461;white-space:nowrap;
  }
  .dd.warn{background:#FBF0D9;color:#B07B2E}
  .dd.bad{background:var(--coral-bg);color:var(--coral)}
  .eat-btn{
    min-height:44px;padding:0 14px;border:none;border-radius:12px;
    background:var(--green);color:#fff;font-size:14px;font-weight:700;
    cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  .eat-btn:active{background:var(--green-deep)}

  /* ===== 곧 할 일 메모 ===== */
  .memo-add{display:flex;gap:8px;margin-bottom:4px}
  .memo-add input{
    flex:1;min-height:48px;padding:0 14px;
    border:1.5px solid var(--line);border-radius:14px;
    font-size:15px;background:#fff;color:var(--ink);font-family:inherit;
  }
  .memo-add input:focus{outline:2px solid var(--green);border-color:transparent}
  .memo-add button{
    min-height:48px;padding:0 18px;border:none;border-radius:14px;
    background:var(--green);color:#fff;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  .memo-item{
    background:var(--card);border-radius:14px;box-shadow:var(--shadow);
    padding:10px 10px 10px 16px;margin-top:8px;
    display:flex;align-items:center;gap:8px;
  }
  .memo-item .nm{flex:1;font-weight:600;word-break:keep-all}
  .memo-done{
    min-width:64px;min-height:44px;border:none;border-radius:12px;
    background:var(--green);color:#fff;font-size:14px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }
  .memo-done:active{background:var(--green-deep)}
  .memo-x{
    width:44px;height:44px;border:none;border-radius:12px;
    background:#EFEBDF;color:#8A8266;font-size:17px;font-weight:700;
    cursor:pointer;font-family:inherit;line-height:1;
  }
  .memo-x:active{background:var(--coral-bg);color:var(--coral)}

  /* ===== 기록 화면 ===== */
  .summary{
    background:linear-gradient(135deg,#4C7A5A,#5E8E6C);
    color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:18px;
    box-shadow:var(--shadow);
  }
  .summary .n{font-size:34px;font-weight:800;line-height:1.2}
  .summary .t{font-size:14px;opacity:.9}
  .log-item{
    background:var(--card);border-radius:14px;box-shadow:var(--shadow);
    padding:13px 16px;margin-bottom:8px;
    display:flex;align-items:center;gap:10px;
  }
  .log-item .dt{font-size:13px;color:var(--muted);min-width:78px}
  .log-item .nm{flex:1;font-weight:600}
  .log-type{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
  .log-type[data-t="완료"]{background:#E4F0E3;color:var(--green)}
  .log-type[data-t="미룸"]{background:#FBF0D9;color:#B07B2E}

  /* ===== 하단 탭 ===== */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1;min-height:64px;border:none;background:transparent;
    font-size:12px;font-weight:600;color:#A9A493;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-family:inherit;
  }
  nav button .ic{font-size:22px;line-height:1}
  nav button.on{color:var(--green)}

  /* ===== 바텀시트 폼 ===== */
  .sheet-bg{
    position:fixed;inset:0;background:rgba(50,45,35,.4);z-index:100;
    display:none;align-items:flex-end;
  }
  .sheet-bg.show{display:flex}
  .sheet{
    background:var(--bg);width:100%;max-height:88vh;overflow-y:auto;
    border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    animation:slideup .22s ease;
  }
  @keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h2{font-size:20px;margin-bottom:18px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px;color:#6B6450}
  .field input[type=text],.field input[type=number],.field input[type=date],.field select{
    width:100%;min-height:52px;padding:0 14px;
    border:1.5px solid var(--line);border-radius:14px;
    font-size:16px;background:#fff;color:var(--ink);font-family:inherit;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--green);border-color:transparent}
  .field .hint{font-size:13px;color:var(--muted);margin-top:6px;padding-left:2px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{
    min-height:44px;padding:0 16px;border-radius:999px;
    border:1.5px solid var(--line);background:#fff;color:var(--muted);
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .chips button.sel{background:var(--green);border-color:var(--green);color:#fff}
  .cyc-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .cyc-row select{flex:1;min-width:140px}
  .cyc-row input{max-width:90px;text-align:center}
  .cyc-row .suffix{font-size:15px;color:var(--muted)}
  .sheet-acts{display:flex;gap:10px;margin-top:22px}
  .sheet-acts button{
    flex:1;min-height:54px;border:none;border-radius:14px;
    font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .b-cancel{background:#E7E2D5;color:#6B6450}
  .b-save{background:var(--green);color:#fff}

  /* ===== 토스트 ===== */
  #toast{
    position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(10px);
    background:#3A3830;color:#fff;font-size:14px;
    padding:11px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.25s;z-index:200;
    white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="date" id="headDate"></div>
  <h1 class="disp" id="headTitle">오늘의 <b>루틴</b></h1>
</header>

<main id="main"></main>

<nav>
  <button data-tab="today" class="on"><span class="ic">🌱</span>오늘</button>
  <button data-tab="upcoming"><span class="ic">📅</span>예정</button>
  <button data-tab="foods"><span class="ic">🥕</span>음식</button>
  <button data-tab="manage"><span class="ic">✏️</span>관리</button>
  <button data-tab="history"><span class="ic">📖</span>기록</button>
</nav>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true">
    <h2 class="disp" id="sheetTitle">새 루틴 추가</h2>
    <div class="field">
      <label for="fName">이름</label>
      <input type="text" id="fName" placeholder="예: 화분 물주기" maxlength="40">
    </div>
    <div class="field">
      <label>카테고리</label>
      <div class="chips" id="fCats"></div>
    </div>
    <div class="field">
      <label>반복 주기</label>
      <div class="cyc-row">
        <select id="fCycType">
          <option value="한번">한 번만 (반복 없음)</option>
          <option value="매일">매일</option>
          <option value="일" selected>N일마다</option>
          <option value="주">N주마다</option>
          <option value="월">N개월마다</option>
          <option value="요일">매주 특정 요일</option>
          <option value="월일">매월 특정 날짜</option>
        </select>
        <input type="number" id="fCycVal" min="1" max="365" value="2" inputmode="numeric">
        <select id="fDow" style="display:none;max-width:130px">
          <option value="1">월요일</option>
          <option value="2">화요일</option>
          <option value="3">수요일</option>
          <option value="4">목요일</option>
          <option value="5">금요일</option>
          <option value="6">토요일</option>
          <option value="0">일요일</option>
        </select>
        <input type="number" id="fMDay" min="1" max="31" value="15" inputmode="numeric" style="display:none">
        <span class="suffix" id="fCycSuffix">일마다</span>
      </div>
    </div>
    <div class="field">
      <label for="fNext">첫 시작일</label>
      <input type="date" id="fNext">
      <div class="hint" id="fNextHint">누르면 달력에서 고를 수 있어요</div>
    </div>
    <div class="sheet-acts">
      <button class="b-cancel" onclick="closeSheet()">취소</button>
      <button class="b-save" id="fSave">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwsVgMEuKfSFf0JjeS23jTD7_vO1peIWOg_253tpSME9jmIj-ZG7iktOODZfsQfk7r5/exec";
const DEFAULT_CATS = ["집안일","식물","반려동물","건강","기타"];
const DOW = ["일","월","화","수","목","금","토"];

let tasks = [];
let logs = [];
let foods = [];  // 음식 목록 { id, name, expiry(빈칸 가능), qty }
let categories = DEFAULT_CATS.slice();  // 서버에서 불러오면 덮어씀
let tab = "today";
let loading = true;
let editingId = null;   // null = 추가 모드
let selCat = "집안일";

/* ---------- 날짜 유틸 ---------- */
function fmt(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function todayStr(){ return fmt(new Date()); }
function parse(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parse(s); d.setDate(d.getDate()+n); return fmt(d); }
function addMonths(s, n){
  const d = parse(s);
  const day = d.getDate();
  d.setMonth(d.getMonth()+n);
  if (d.getDate() < day) d.setDate(0); // 말일 보정
  return fmt(d);
}
function diffDays(a, b){ return Math.round((parse(a) - parse(b)) / 86400000); }
function prettyDate(s){
  const d = parse(s);
  return (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + DOW[d.getDay()] + ")";
}
function relLabel(s){
  const n = diffDays(s, todayStr());
  if (n === 0) return "오늘";
  if (n === 1) return "내일";
  if (n === 2) return "모레";
  return n + "일 뒤";
}

/* ---------- 주기 계산 ---------- */
function cycleText(t){
  const v = Number(t.cycleValue) || 1;
  if (t.cycleType === "한번") return "한 번만";
  if (t.cycleType === "매일") return "매일";
  if (t.cycleType === "일") return v + "일마다";
  if (t.cycleType === "주") return v + "주마다";
  if (t.cycleType === "월") return v + "개월마다";
  if (t.cycleType === "요일") return "매주 " + (DOW[v] || "?") + "요일";
  if (t.cycleType === "월일") return "매월 " + v + "일";
  return "";
}
// 해당 월에 그 날짜가 없으면 말일로 보정 (예: 매월 31일 → 2월엔 28/29일)
function clampMonthDay(y, m, day){
  const last = new Date(y, m+1, 0).getDate();
  return new Date(y, m, Math.min(day, last));
}
function nextWeekday(fromStr, dow, includeToday){
  const d = parse(fromStr);
  let diff = (dow - d.getDay() + 7) % 7;
  if (diff === 0 && !includeToday) diff = 7;
  d.setDate(d.getDate() + diff);
  return fmt(d);
}
function nextMonthDay(fromStr, day, includeToday){
  const f = parse(fromStr);
  let cand = clampMonthDay(f.getFullYear(), f.getMonth(), day);
  const minGap = includeToday ? 0 : 1;
  if (diffDays(fmt(cand), fromStr) < minGap){
    cand = clampMonthDay(f.getFullYear(), f.getMonth()+1, day);
  }
  return fmt(cand);
}
// 완료 시: 오늘 기준 다음 예정일
function nextFromToday(t){
  const today = todayStr();
  const v = Number(t.cycleValue) || 1;
  switch (t.cycleType){
    case "매일": return addDays(today, 1);
    case "일":   return addDays(today, v);
    case "주":   return addDays(today, v * 7);
    case "월":   return addMonths(today, v);
    case "요일": return nextWeekday(today, v, false);
    case "월일": return nextMonthDay(today, v, false);
    default:     return addDays(today, 1);
  }
}
// 새 루틴 생성/주기 변경 시: 첫 예정일 (오늘 포함 가장 가까운 날)
function firstDateFor(cycleType, v){
  const today = todayStr();
  if (cycleType === "요일") return nextWeekday(today, v, true);
  if (cycleType === "월일") return nextMonthDay(today, v, true);
  return today;
}

/* ---------- API (백그라운드 저장: 순차 처리 + 자동 재시도) ---------- */
/* 속도 개선: 마지막 화면을 폰에 저장해두고(캐시) 앱을 열면 즉시 보여준 뒤,
   서버(구글 시트)에서 최신 데이터를 뒤에서 조용히 받아와요.
   진짜 데이터는 항상 구글 시트에 있으니, 캐시를 지워도 데이터는 안전해요. */
const CACHE_KEY = "routine-cache-v1";
let dirty = false;  // 캐시 화면에서 사용자가 뭔가 바꿨으면 true (서버 응답이 덮어쓰지 않게)

function saveCache(){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      tasks: tasks, logs: logs, foods: foods, categories: categories
    }));
  }catch(e){ /* 저장 공간 문제 등은 조용히 무시 - 캐시는 있으면 좋은 것일 뿐 */ }
}
function loadCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    tasks = Array.isArray(d.tasks) ? d.tasks : [];
    logs = Array.isArray(d.logs) ? d.logs : [];
    foods = Array.isArray(d.foods) ? d.foods : [];
    if (Array.isArray(d.categories) && d.categories.length > 0){
      categories = d.categories.map(String);
    }
    return true;
  }catch(e){ return false; }
}

async function loadAll(){
  // 1단계: 캐시가 있으면 즉시 화면부터 (스켈레톤 없이)
  const hasCache = loadCache();
  loading = !hasCache;
  dirty = false;
  render();
  // 2단계: 서버에서 최신 데이터 받아오기
  try{
    const res = await fetch(API);
    const data = await res.json();
    if (!data.ok) throw new Error("서버 응답 오류");
    if (!dirty){
      // 캐시 화면을 보는 동안 아무것도 안 바꿨을 때만 서버 데이터로 갱신
      tasks = Array.isArray(data.tasks) ? data.tasks : [];
      logs = Array.isArray(data.logs) ? data.logs : [];
      foods = Array.isArray(data.foods) ? data.foods : [];
      if (Array.isArray(data.categories) && data.categories.length > 0){
        categories = data.categories.map(String);
      }
      saveCache();
    }
  }catch(e){
    if (!hasCache){
      toast("데이터를 불러오지 못했어요. 새로고침 해주세요");
      tasks = []; logs = []; foods = [];
    }
    // 캐시가 있으면 그대로 보여주면 되니 조용히 넘어가요
  }
  loading = false;
  render();
}
// 저장 요청을 한 줄로 세워서 순서대로 보내고, 실패하면 1.5초 후 한 번 더 시도
let postChain = Promise.resolve();
function post(payload, failMsg){
  postChain = postChain.then(async () => {
    const send = async () => {
      const r = await fetch(API, { method:"POST", body: JSON.stringify(payload) });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || "save failed");
    };
    try{
      await send();
    }catch(e1){
      await new Promise(res => setTimeout(res, 1500));
      try{ await send(); }
      catch(e2){ toast(failMsg); }
    }
  });
}
function saveTasks(){ dirty = true; saveCache(); post({ action:"saveTasks", tasks: tasks }, "저장에 실패했어요 (연결 확인)"); }
function saveCategories(){ dirty = true; saveCache(); post({ action:"saveCategories", categories: categories }, "카테고리 저장에 실패했어요"); }
function saveFoods(){ dirty = true; saveCache(); post({ action:"saveFoods", foods: foods }, "음식 저장에 실패했어요"); }
function addLog(name, type){
  const log = { date: todayStr(), name: name, type: type };
  logs.unshift(log);
  dirty = true; saveCache();
  post({ action:"addLog", log: log }, "기록 저장에 실패했어요");
}

/* ---------- 할 일 동작 ---------- */
function doComplete(id){
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  addLog(t.name, "완료");
  if (t.cycleType === "한번"){
    tasks = tasks.filter(x => x.id !== id);
    render();
    toast("완료! 한 번짜리 일이라 목록에서 정리했어요 ✨");
  }else{
    t.nextDate = nextFromToday(t);
    render();
    toast("완료! " + relLabel(t.nextDate) + " 다시 알려드릴게요 🌿");
  }
  saveTasks();
}
function doPostpone(id, days){
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.nextDate = addDays(todayStr(), days);
  addLog(t.name, "미룸");
  render();
  toast(days === 1 ? "내일 다시 할게요, 괜찮아요 🙂" : "다음 주로 미뤘어요. 쉬어가도 돼요 ☕");
  saveTasks();
}
function doDelete(id){
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  if (!confirm('"' + t.name + '" 루틴을 삭제할까요?')) return;
  tasks = tasks.filter(x => x.id !== id);
  render();
  toast("삭제했어요");
  saveTasks();
}

/* ---------- 음식 동작 ---------- */
function foodDday(expiry){
  if (!expiry) return { txt: "기한 없음", cls: "" };
  const n = diffDays(expiry, todayStr());
  if (n < 0) return { txt: (-n) + "일 지남", cls: "bad" };
  if (n === 0) return { txt: "오늘까지", cls: "bad" };
  if (n <= 3) return { txt: "D-" + n, cls: "warn" };
  return { txt: "D-" + n, cls: "" };
}
function addFood(){
  const nameEl = document.getElementById("foodName");
  const expEl = document.getElementById("foodExp");
  const qtyEl = document.getElementById("foodQty");
  const name = (nameEl.value || "").trim();
  const exp = expEl.value;  // 비워두면 유통기한 없음
  let qty = parseInt(qtyEl.value, 10);
  if (!name){ toast("음식 이름을 입력해주세요"); return; }
  if (!qty || qty < 1) qty = 1;
  if (qty > 99) qty = 99;
  foods.push({
    id: "f" + Date.now() + Math.floor(Math.random()*1000),
    name: name,
    expiry: exp || "",
    qty: qty
  });
  render();
  const qtyMsg = qty > 1 ? " " + qty + "개" : "";
  toast('"' + name + '"' + qtyMsg + ' 등록! ' + (exp ? '유통기한 챙겨드릴게요 🥕' : '잘 기억해둘게요 🥕'));
  saveFoods();
}
function eatFood(id){
  const f = foods.find(x => x.id === id);
  if (!f) return;
  const qty = Number(f.qty) || 1;
  if (qty > 1){
    f.qty = qty - 1;
    render();
    toast('"' + f.name + '" 하나 드셨네요! ' + f.qty + '개 남았어요 🍽️');
  } else {
    foods = foods.filter(x => x.id !== id);
    render();
    toast('"' + f.name + '" 맛있게 드셨네요! 🍽️');
  }
  saveFoods();
}

function renderCatChips(){
  const box = document.getElementById("fCats");

  const list = categories.includes(selCat) ? categories : categories.concat([selCat]);
  list.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";

    if (c === selCat) b.classList.add("sel");
    b.onclick = () => { selCat = c; renderCatChips(); };
    box.appendChild(b);
  });
}
function currentCycle(){
  const type = document.getElementById("fCycType").value;
  let v = 1;
  if (type === "요일") v = parseInt(document.getElementById("fDow").value, 10);
  else if (type === "월일") v = Math.min(31, Math.max(1, parseInt(document.getElementById("fMDay").value, 10) || 1));
  else if (type !== "매일" && type !== "한번") v = Math.max(1, parseInt(document.getElementById("fCycVal").value, 10) || 1);
  return { type: type, value: v };
}
function syncCycUI(){
  const type = document.getElementById("fCycType").value;
  const val = document.getElementById("fCycVal");
  const dow = document.getElementById("fDow");
  const mday = document.getElementById("fMDay");
  const suf = document.getElementById("fCycSuffix");
  val.style.display = "none"; dow.style.display = "none"; mday.style.display = "none";
  if (type === "매일" || type === "한번"){ suf.textContent = ""; }
  else if (type === "요일"){ dow.style.display = ""; suf.textContent = "마다"; }
  else if (type === "월일"){ mday.style.display = ""; suf.textContent = "일마다"; }
  else{
    val.style.display = "";
    suf.textContent = { "일":"일마다", "주":"주마다", "월":"개월마다" }[type];
  }
  const fn = document.getElementById("fNext");
  if (initSheet){
    if (!fn.value) fn.value = defaultFirstDate();  // 새 루틴: 가장 가까운 날로 기본 설정
    updateHint();
  }else{
    snapFirstDate();  // 주기를 바꾸면 고른 날짜를 주기에 맞게 보정
  }
}
function defaultFirstDate(){
  const c = currentCycle();
  return firstDateFor(c.type, c.value);
}
// 고른 날짜가 주기와 안 맞으면(예: 매주 월요일인데 수요일 선택) 가까운 맞는 날로 이동
function snapFirstDate(){
  const el = document.getElementById("fNext");
  const c = currentCycle();
  if (!el.value){ el.value = defaultFirstDate(); updateHint(); return; }
  let v = el.value;
  if (v < todayStr()){
    v = todayStr();
    toast("오늘 이후 날짜만 고를 수 있어요");
  }
  if (c.type === "요일"){
    const snapped = nextWeekday(v, c.value, true);
    if (snapped !== v){
      toast("매주 " + DOW[c.value] + "요일이라 " + prettyDate(snapped) + "로 맞췄어요");
      v = snapped;
    }
  }else if (c.type === "월일"){
    const snapped = nextMonthDay(v, c.value, true);
    if (snapped !== v){
      toast("매월 " + c.value + "일이라 " + prettyDate(snapped) + "로 맞췄어요");
      v = snapped;
    }
  }
  el.value = v;
  updateHint();
}
function updateHint(){

  const h = document.getElementById("fNextHint");
  if (el.value){
    h.textContent = prettyDate(el.value) + " (" + relLabel(el.value) + ") 시작";
  }else{
    h.textContent = "누르면 달력에서 고를 수 있어요";
  }
}

function finalFirstDate(c){
  let v = document.getElementById("fNext").value;
  if (!v) return firstDateFor(c.type, c.value);
  if (!editingId && v < todayStr()) v = todayStr();
  if (c.type === "요일") v = nextWeekday(v, c.value, true);
  else if (c.type === "월일") v = nextMonthDay(v, c.value, true);
  return v;
}

/* ---------- 렌더링 ---------- */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function skeletons(n){

  for (let i = 0; i < n; i++){
    h += '<div class="skel"><div class="bar w60"></div><div class="bar" style="width:35%"></div><div class="bar tall"></div></div>';
  }
  return h;
}

function renderToday(){

    .filter(t => t.cycleType !== "메모" && t.nextDate && diffDays(t.nextDate, today) <= 0)
    .sort((a, b) => diffDays(a.nextDate, today) - diffDays(b.nextDate, today)); // 많이 밀린 것 위로

  let html = "";

    html += '<div class="empty" style="padding:44px 20px 32px"><div class="big">🎉</div><div class="msg disp">오늘은 쉬는 날이에요</div><div class="sub">해야 할 루틴이 없어요. 푹 쉬세요!</div></div>';
  }else{
    html += due.map(t => {

          <div class="name">${esc(t.name)}</div>
          ${late > 0 ? `<span class="badge-late">${late}일 밀림</span>` : ""}

        <div class="cycle">${cycleText(t)} 반복</div>
        <div class="btnrow">
          <button class="b-done" onclick="doComplete('${t.id}')">완료 ✓</button>
          <button class="b-tmrw" onclick="doPostpone('${t.id}',1)">내일로 🌙</button>
          <button class="b-week" onclick="doPostpone('${t.id}',7)">다음 주로</button>
        </div>
      </div>`;
    }).join("");
  }

  // 곧 할 일 메모 (날짜 없이 가볍게)
  html += '<div class="sec-title">🗒️ 곧 할 일 메모</div>';
  html += '<div class="memo-add">';
  html += '<input type="text" id="memoInput" placeholder="가볍게 적어두기 (예: 건전지 사기)" maxlength="40" onkeydown="if(event.key===\'Enter\')addMemo()">';
  html += '<button onclick="addMemo()">추가</button>';
  html += '</div>';
  if (memos.length > 0){
    html += memos.map(t => `
    <div class="memo-item">
      <span class="nm">${esc(t.name)}</span>
      <button class="memo-done" onclick="doneMemo('${t.id}')">✓ 완료</button>
      <button class="memo-x" onclick="removeMemo('${t.id}')" aria-label="지우기">×</button>
    </div>`).join("");
  }
  return html;
}

function renderUpcoming(){
  const today = todayStr();
  let html = "";
  let any = false;
  for (let i = 1; i <= 7; i++){
    const day = addDays(today, i);
    const list = tasks.filter(t => t.cycleType !== "메모" && t.nextDate === day);
    html += `<div class="day-head"><span class="d disp">${prettyDate(day)}</span><span class="rel">${relLabel(day)}</span></div>`;
    if (list.length === 0){
      html += '<div class="day-none">예정된 일이 없어요</div>';
    }else{
      any = true;
      html += list.map(t => `
        <div class="up-item">
          <span class="nm">${esc(t.name)}</span>
          <span class="badge-cat" data-c="${esc(t.category)}">${esc(t.category)}</span>
        </div>`).join("");
    }
  }
  if (!any && tasks.length === 0){
    return '<div class="empty"><div class="big">📅</div><div class="msg disp">아직 루틴이 없어요</div><div class="sub">관리 탭에서 첫 루틴을 만들어보세요</div></div>';
  }
  return html;
}

function renderManage(){
  let html = '<button class="add-btn" onclick="openSheet()">＋ 새 루틴 추가</button>';
  const routines = tasks.filter(t => t.cycleType !== "메모");
  if (routines.length === 0){
    html += '<div class="empty" style="padding:36px 20px"><div class="big">🌱</div><div class="msg disp">첫 루틴을 만들어보세요</div><div class="sub">예: 이틀에 한 번 화분 물주기</div></div>';
  }else{
    const sorted = [...routines].sort((a, b) => (a.nextDate || "").localeCompare(b.nextDate || ""));
    html += sorted.map(t => `
      <div class="mg-item">
        <div class="row1">
          <span class="nm">${esc(t.name)}</span>
          <span class="badge-cat" data-c="${esc(t.category)}">${esc(t.category)}</span>
        </div>
        <div class="info">${cycleText(t)} 반복 · 다음: ${prettyDate(t.nextDate)} (${relLabel(t.nextDate)})</div>
        <div class="acts">
          <button class="b-edit" onclick="openSheet('${t.id}')">수정</button>
          <button class="b-del" onclick="doDelete('${t.id}')">삭제</button>
        </div>
      </div>`).join("");
  }

  // 카테고리 관리
  html += '<div class="sec-title">카테고리 관리</div>';
  html += '<div class="cat-box"><div class="cat-list">';
  html += categories.map(c =>
    `<span class="cat-chip">${esc(c)}<button data-c="${esc(c)}" onclick="delCategory(this.dataset.c)" aria-label="삭제">×</button></span>`
  ).join("");
  html += '</div><div class="cat-add">';
  html += '<input type="text" id="newCat" placeholder="새 카테고리 이름" maxlength="10">';
  html += '<button onclick="addCategory()">추가</button>';
  html += '</div></div>';
  return html;
}

function renderFoods(){
  let html = `
  <div class="cat-box" style="margin-bottom:18px">
    <div class="food-form">
      <input type="text" id="foodName" placeholder="음식 이름 (예: 우유)" maxlength="20">
      <div class="food-row">
        <input type="date" id="foodExp" class="grow" aria-label="유통기한">
        <input type="number" id="foodQty" class="food-qty" value="1" min="1" max="99" inputmode="numeric" aria-label="개수">
      </div>
      <div class="food-hint">유통기한이 없으면 날짜는 비워두세요 · 오른쪽은 개수</div>
      <button onclick="addFood()">＋ 등록</button>
    </div>
  </div>`;

  if (foods.length === 0){
    html += '<div class="empty" style="padding:40px 20px"><div class="big">🥕</div><div class="msg disp">등록된 음식이 없어요</div><div class="sub">냉장고 속 음식을 등록해보세요</div></div>';
    return html;
  }

  // 유통기한 가까운 순, 기한 없는 음식은 맨 아래로
  const sorted = [...foods].sort((a, b) => (a.expiry || "9999-12-31").localeCompare(b.expiry || "9999-12-31"));
  const urgent = sorted.filter(f => f.expiry && diffDays(f.expiry, todayStr()) <= 3).length;
  if (urgent > 0){
    html += '<div class="sec-title" style="margin-top:0">⏰ 유통기한 임박한 음식 ' + urgent + '개 — 먼저 드세요!</div>';
  }
  html += sorted.map(f => {
    const d = foodDday(f.expiry);
    const qty = Number(f.qty) || 1;
    const qtyBadge = qty > 1 ? '<span class="qty-badge">×' + qty + '</span>' : '';
    const dateLine = f.expiry ? (prettyDate(f.expiry) + "까지") : "유통기한 없음";
    return `
    <div class="up-item">
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(f.name)}${qtyBadge}</div>
        <div style="font-size:13px;color:var(--muted)">${dateLine}</div>
      </div>
      <span class="dd ${d.cls}">${d.txt}</span>
      <button class="eat-btn" onclick="eatFood('${f.id}')">${qty > 1 ? "하나 먹음 ✓" : "다 먹음 ✓"}</button>
    </div>`;
  }).join("");
  return html;
}

function renderHistory(){
  const today = todayStr();
  const weekAgo = addDays(today, -6);
  const doneCount = logs.filter(l => l.type === "완료" && l.date >= weekAgo && l.date <= today).length;

  let html = `
    <div class="summary">
      <div class="n">${doneCount}개 완료</div>
      <div class="t">최근 7일 동안 해낸 일 · 잘하고 있어요 👏</div>
    </div>`;

  if (logs.length === 0){
    html += '<div class="empty"><div class="big">📖</div><div class="msg disp">아직 기록이 없어요</div><div class="sub">오늘 탭에서 첫 완료를 눌러보세요</div></div>';
    return html;
  }

  const sorted = [...logs].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  html += sorted.slice(0, 100).map(l => `
    <div class="log-item">
      <span class="dt">${l.date ? prettyDate(l.date) : ""}</span>
      <span class="nm">${esc(l.name)}</span>
      <span class="log-type" data-t="${esc(l.type)}">${esc(l.type)}</span>
    </div>`).join("");
  return html;
}

function render(){
  // 헤더
  const now = new Date();
  document.getElementById("headDate").textContent =
    now.getFullYear() + "년 " + (now.getMonth()+1) + "월 " + now.getDate() + "일 (" + DOW[now.getDay()] + ")";
  const titles = {
    today: '오늘의 <b>루틴</b>',
    upcoming: '앞으로 <b>7일</b>',
    foods: '우리집 <b>음식</b>',
    manage: '루틴 <b>관리</b>',
    history: '나의 <b>기록</b>'
  };
  document.getElementById("headTitle").innerHTML = titles[tab];

  const main = document.getElementById("main");
  if (loading){
    main.innerHTML = skeletons(3);
    return;
  }
  if (tab === "today") main.innerHTML = renderToday();
  else if (tab === "upcoming") main.innerHTML = renderUpcoming();
  else if (tab === "foods") main.innerHTML = renderFoods();
  else if (tab === "manage") main.innerHTML = renderManage();
  else main.innerHTML = renderHistory();
}

/* ---------- 탭 ---------- */
document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => {
    tab = b.dataset.tab;
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
    window.scrollTo(0, 0);
    render();
  });
});

/* ---------- 시작 ---------- */
loadAll();

// 자정 넘김 대비: 탭 복귀 시 날짜 갱신
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) render();
});
</script>
</body>
</html>
