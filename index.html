<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EA">
<title>우리집 루틴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F2EA;          /* 쌀뜨물 같은 배경 */
    --card:#FFFFFF;
    --ink:#3A3830;
    --muted:#8E897B;
    --line:#E7E2D5;
    --green:#4C7A5A;       /* 완료 - 잎사귀 초록 */
    --green-deep:#3E664B;
    --honey:#F0C069;       /* 내일로 - 꿀색 */
    --honey-deep:#D9A54A;
    --taupe:#D9CDB8;       /* 다음 주로 - 모래색 */
    --taupe-deep:#C4B599;
    --coral:#E07856;       /* 밀림 배지 */
    --coral-bg:#FBE9E2;
    --radius:18px;
    --shadow:0 2px 10px rgba(90,80,60,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard',-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif;
    font-size:16px;
    line-height:1.5;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
  }
  .disp{font-family:'Gowun Dodum',sans-serif}

  /* ===== 헤더 ===== */
  header{
    padding:22px 20px 10px;
  }
  header .date{font-size:14px;color:var(--muted);margin-bottom:2px}
  header h1{font-size:24px;font-weight:400;letter-spacing:-.3px}
  header h1 b{font-weight:400;color:var(--green)}

  main{padding:8px 16px 24px;max-width:560px;margin:0 auto}

  /* ===== 카드 ===== */
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px 16px 14px;
    margin-bottom:14px;
    animation:rise .25s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.card{animation:none}}

  .card .top{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
  .card .name{font-size:18px;font-weight:600;flex:1;word-break:keep-all}
  .badge-cat{
    font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap;
    background:#EFEBDF;color:#7A7461;
  }
  .badge-cat[data-c="식물"]{background:#E4F0E3;color:#4C7A5A}
  .badge-cat[data-c="반려동물"]{background:#FBEEDC;color:#B07B2E}
  .badge-cat[data-c="건강"]{background:#E4EDF4;color:#4A7391}
  .badge-cat[data-c="집안일"]{background:#F0E9F4;color:#7B5E92}
  .badge-late{
    display:inline-flex;align-items:center;
    font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;
    background:var(--coral-bg);color:var(--coral);white-space:nowrap;
  }
  .card .cycle{font-size:13px;color:var(--muted);margin-top:-8px;margin-bottom:12px}

  .btnrow{display:flex;gap:8px}
  .btnrow button{
    flex:1;
    min-height:52px;
    border:none;border-radius:14px;
    font-size:15px;font-weight:700;
    cursor:pointer;
    transition:transform .08s ease,filter .15s;
    font-family:inherit;
  }
  .btnrow button:active{transform:scale(.96)}
  .b-done{background:var(--green);color:#fff}
  .b-done:active{background:var(--green-deep)}
  .b-tmrw{background:var(--honey);color:#5C4715}
  .b-tmrw:active{background:var(--honey-deep)}
  .b-week{background:var(--taupe);color:#5B5340}
  .b-week:active{background:var(--taupe-deep)}

  /* ===== 빈 상태 ===== */
  .empty{
    text-align:center;padding:64px 20px;color:var(--muted);
  }
  .empty .big{font-size:44px;margin-bottom:14px}
  .empty .msg{font-size:19px;color:var(--ink)}
  .empty .sub{font-size:14px;margin-top:6px}

  /* ===== 스켈레톤 ===== */
  .skel{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px 16px;margin-bottom:14px;
  }
  .skel .bar{
    height:16px;border-radius:8px;margin-bottom:12px;
    background:linear-gradient(90deg,#EFEBE0 25%,#F7F4EC 50%,#EFEBE0 75%);
    background-size:200% 100%;
    animation:shimmer 1.3s infinite;
  }
  .skel .bar.w60{width:60%}
  .skel .bar.tall{height:48px;margin-bottom:0}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

  /* ===== 예정 화면 ===== */
  .day-head{
    display:flex;align-items:baseline;gap:8px;
    margin:20px 4px 10px;
  }
  .day-head .d{font-size:16px;font-weight:700}
  .day-head .rel{font-size:13px;color:var(--muted)}
  .up-item{
    background:var(--card);border-radius:14px;box-shadow:var(--shadow);
    padding:14px 16px;margin-bottom:8px;
    display:flex;align-items:center;gap:10px;
  }
  .up-item .nm{flex:1;font-weight:600}
  .day-none{font-size:14px;color:var(--muted);padding:4px 6px 2px}

  /* ===== 관리 화면 ===== */
  .add-btn{
    width:100%;min-height:56px;border:2px dashed #CFC8B4;border-radius:var(--radius);
    background:transparent;color:#8A8266;font-size:16px;font-weight:700;
    cursor:pointer;margin-bottom:16px;font-family:inherit;
  }
  .add-btn:active{background:#EFEBDF}
  .mg-item{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;margin-bottom:12px;
  }
  .mg-item .row1{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .mg-item .nm{font-size:17px;font-weight:600;flex:1}
  .mg-item .info{font-size:13px;color:var(--muted);margin-bottom:12px}
  .mg-item .acts{display:flex;gap:8px}
  .mg-item .acts button{
    flex:1;min-height:44px;border:none;border-radius:12px;
    font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .b-edit{background:#EFEBDF;color:#6B6450}
  .b-del{background:#FBE9E2;color:var(--coral)}

  /* ===== 기록 화면 ===== */
  .summary{
    background:linear-gradient(135deg,#4C7A5A,#5E8E6C);
    color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:18px;
    box-shadow:var(--shadow);
  }
  .summary .n{font-size:34px;font-weight:800;line-height:1.2}
  .summary .t{font-size:14px;opacity:.9}
  .log-item{
    background:var(--card);border-radius:14px;box-shadow:var(--shadow);
    padding:13px 16px;margin-bottom:8px;
    display:flex;align-items:center;gap:10px;
  }
  .log-item .dt{font-size:13px;color:var(--muted);min-width:78px}
  .log-item .nm{flex:1;font-weight:600}
  .log-type{
    font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;
  }
  .log-type[data-t="완료"]{background:#E4F0E3;color:var(--green)}
  .log-type[data-t="미룸"]{background:#FBF0D9;color:#B07B2E}

  /* ===== 하단 탭 ===== */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1;min-height:64px;border:none;background:transparent;
    font-size:12px;font-weight:600;color:#A9A493;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-family:inherit;
  }
  nav button .ic{font-size:22px;line-height:1}
  nav button.on{color:var(--green)}

  /* ===== 바텀시트 폼 ===== */
  .sheet-bg{
    position:fixed;inset:0;background:rgba(50,45,35,.4);z-index:100;
    display:none;align-items:flex-end;
  }
  .sheet-bg.show{display:flex}
  .sheet{
    background:var(--bg);width:100%;max-height:88vh;overflow-y:auto;
    border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    animation:slideup .22s ease;
  }
  @keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h2{font-size:20px;margin-bottom:18px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px;color:#6B6450}
  .field input[type=text],.field input[type=number],.field select{
    width:100%;min-height:52px;padding:0 14px;
    border:1.5px solid var(--line);border-radius:14px;
    font-size:16px;background:#fff;color:var(--ink);font-family:inherit;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--green);border-color:transparent}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{
    min-height:44px;padding:0 16px;border-radius:999px;
    border:1.5px solid var(--line);background:#fff;color:var(--muted);
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .chips button.sel{background:var(--green);border-color:var(--green);color:#fff}
  .cyc-row{display:flex;gap:8px;align-items:center}
  .cyc-row input{max-width:90px;text-align:center}
  .cyc-row .suffix{font-size:15px;color:var(--muted)}
  .sheet-acts{display:flex;gap:10px;margin-top:22px}
  .sheet-acts button{
    flex:1;min-height:54px;border:none;border-radius:14px;
    font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .b-cancel{background:#E7E2D5;color:#6B6450}
  .b-save{background:var(--green);color:#fff}

  /* ===== 토스트 ===== */
  #toast{
    position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(10px);
    background:#3A3830;color:#fff;font-size:14px;
    padding:11px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.25s;z-index:200;
    white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="date" id="headDate"></div>
  <h1 class="disp" id="headTitle">오늘의 <b>루틴</b></h1>
</header>

<main id="main"></main>

<nav>
  <button data-tab="today" class="on"><span class="ic">🌱</span>오늘</button>
  <button data-tab="upcoming"><span class="ic">📅</span>예정</button>
  <button data-tab="manage"><span class="ic">✏️</span>관리</button>
  <button data-tab="history"><span class="ic">📖</span>기록</button>
</nav>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true">
    <h2 class="disp" id="sheetTitle">새 루틴 추가</h2>
    <div class="field">
      <label for="fName">이름</label>
      <input type="text" id="fName" placeholder="예: 화분 물주기" maxlength="40">
    </div>
    <div class="field">
      <label>카테고리</label>
      <div class="chips" id="fCats"></div>
    </div>
    <div class="field">
      <label>반복 주기</label>
      <div class="cyc-row">
        <select id="fCycType">
          <option value="매일">매일</option>
          <option value="일" selected>N일마다</option>
          <option value="주">N주마다</option>
          <option value="월">N개월마다</option>
        </select>
        <input type="number" id="fCycVal" min="1" max="365" value="2" inputmode="numeric">
        <span class="suffix" id="fCycSuffix">일마다</span>
      </div>
    </div>
    <div class="field">
      <label for="fNext">첫 시작일</label>
      <input type="text" id="fNext" readonly style="background:#F1EDE2;color:var(--muted)" value="오늘부터 시작해요">
    </div>
    <div class="sheet-acts">
      <button class="b-cancel" onclick="closeSheet()">취소</button>
      <button class="b-save" id="fSave">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwsVgMEuKfSFf0JjeS23jTD7_vO1peIWOg_253tpSME9jmIj-ZG7iktOODZfsQfk7r5/exec";
const CATS = ["집안일","식물","반려동물","건강","기타"];
const DOW = ["일","월","화","수","목","금","토"];

let tasks = [];
let logs = [];
let tab = "today";
let loading = true;
let editingId = null;   // null = 추가 모드
let selCat = "집안일";

/* ---------- 날짜 유틸 ---------- */
function fmt(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function todayStr(){ return fmt(new Date()); }
function parse(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parse(s); d.setDate(d.getDate()+n); return fmt(d); }
function addMonths(s, n){
  const d = parse(s);
  const day = d.getDate();
  d.setMonth(d.getMonth()+n);
  if (d.getDate() < day) d.setDate(0); // 말일 보정
  return fmt(d);
}
function diffDays(a, b){ return Math.round((parse(a) - parse(b)) / 86400000); }
function prettyDate(s){
  const d = parse(s);
  return (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + DOW[d.getDay()] + ")";
}
function relLabel(s){
  const n = diffDays(s, todayStr());
  if (n === 0) return "오늘";
  if (n === 1) return "내일";
  if (n === 2) return "모레";
  return n + "일 뒤";
}
function cycleText(t){
  if (t.cycleType === "매일") return "매일";
  const u = { "일":"일마다", "주":"주마다", "월":"개월마다" }[t.cycleType] || "";
  return t.cycleValue + u;
}
function nextFromToday(t){
  const today = todayStr();
  if (t.cycleType === "매일") return addDays(today, 1);
  if (t.cycleType === "일") return addDays(today, Number(t.cycleValue) || 1);
  if (t.cycleType === "주") return addDays(today, (Number(t.cycleValue) || 1) * 7);
  if (t.cycleType === "월") return addMonths(today, Number(t.cycleValue) || 1);
  return addDays(today, 1);
}

/* ---------- 토스트 ---------- */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ---------- API (백그라운드 저장) ---------- */
async function loadAll(){
  loading = true;
  render();
  try{
    const res = await fetch(API);
    const data = await res.json();
    if (!data.ok) throw new Error("서버 응답 오류");
    tasks = Array.isArray(data.tasks) ? data.tasks : [];
    logs = Array.isArray(data.logs) ? data.logs : [];
  }catch(e){
    toast("데이터를 불러오지 못했어요. 새로고침 해주세요");
    tasks = []; logs = [];
  }
  loading = false;
  render();
}
function saveTasks(){
  fetch(API, { method:"POST", body: JSON.stringify({ action:"saveTasks", tasks: tasks }) })
    .then(r => r.json())
    .then(d => { if (!d.ok) toast("저장에 실패했어요"); })
    .catch(() => toast("저장에 실패했어요 (연결 확인)"));
}
function addLog(name, type){
  const log = { date: todayStr(), name: name, type: type };
  logs.unshift(log);
  fetch(API, { method:"POST", body: JSON.stringify({ action:"addLog", log: log }) })
    .catch(() => toast("기록 저장에 실패했어요"));
}

/* ---------- 동작 ---------- */
function doComplete(id){
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.nextDate = nextFromToday(t);
  addLog(t.name, "완료");
  render();
  toast("완료! " + relLabel(t.nextDate) + " 다시 알려드릴게요 🌿");
  saveTasks();
}
function doPostpone(id, days){
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.nextDate = addDays(todayStr(), days);
  addLog(t.name, "미룸");
  render();
  toast(days === 1 ? "내일 다시 할게요, 괜찮아요 🙂" : "다음 주로 미뤘어요. 쉬어가도 돼요 ☕");
  saveTasks();
}
function doDelete(id){
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  if (!confirm('"' + t.name + '" 루틴을 삭제할까요?')) return;
  tasks = tasks.filter(x => x.id !== id);
  render();
  toast("삭제했어요");
  saveTasks();
}

/* ---------- 바텀시트 ---------- */
function openSheet(id){
  editingId = id || null;
  const t = editingId ? tasks.find(x => x.id === editingId) : null;
  document.getElementById("sheetTitle").textContent = t ? "루틴 수정" : "새 루틴 추가";
  document.getElementById("fName").value = t ? t.name : "";
  selCat = t ? t.category : "집안일";
  renderCatChips();
  document.getElementById("fCycType").value = t ? t.cycleType : "일";
  document.getElementById("fCycVal").value = t ? (t.cycleValue || 1) : 2;
  document.getElementById("fNext").value = t ? (prettyDate(t.nextDate) + " 예정") : "오늘부터 시작해요";
  syncCycUI();
  document.getElementById("sheetBg").classList.add("show");
}
function closeSheet(){
  document.getElementById("sheetBg").classList.remove("show");
}
function renderCatChips(){
  const box = document.getElementById("fCats");
  box.innerHTML = "";
  CATS.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = c;
    if (c === selCat) b.classList.add("sel");
    b.onclick = () => { selCat = c; renderCatChips(); };
    box.appendChild(b);
  });
}
function syncCycUI(){
  const type = document.getElementById("fCycType").value;
  const val = document.getElementById("fCycVal");
  const suf = document.getElementById("fCycSuffix");
  if (type === "매일"){
    val.style.display = "none"; suf.textContent = "";
  }else{
    val.style.display = "";
    suf.textContent = { "일":"일마다", "주":"주마다", "월":"개월마다" }[type];
  }
}
document.getElementById("fCycType").addEventListener("change", syncCycUI);

document.getElementById("fSave").addEventListener("click", () => {
  const name = document.getElementById("fName").value.trim();
  if (!name){ toast("이름을 입력해주세요"); return; }
  const cycleType = document.getElementById("fCycType").value;
  let cycleValue = cycleType === "매일" ? 1 : Math.max(1, parseInt(document.getElementById("fCycVal").value, 10) || 1);

  if (editingId){
    const t = tasks.find(x => x.id === editingId);
    if (t){
      t.name = name; t.category = selCat;
      t.cycleType = cycleType; t.cycleValue = cycleValue;
    }
    toast("수정했어요");
  }else{
    tasks.push({
      id: "t" + Date.now() + Math.floor(Math.random()*1000),
      name: name,
      category: selCat,
      cycleType: cycleType,
      cycleValue: cycleValue,
      nextDate: todayStr()
    });
    toast("루틴을 추가했어요 🌱");
  }
  closeSheet();
  render();
  saveTasks();
});

document.getElementById("sheetBg").addEventListener("click", e => {
  if (e.target.id === "sheetBg") closeSheet();
});

/* ---------- 렌더링 ---------- */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function skeletons(n){
  let h = "";
  for (let i = 0; i < n; i++){
    h += '<div class="skel"><div class="bar w60"></div><div class="bar" style="width:35%"></div><div class="bar tall"></div></div>';
  }
  return h;
}

function renderToday(){
  const today = todayStr();
  const due = tasks
    .filter(t => t.nextDate && diffDays(t.nextDate, today) <= 0)
    .sort((a, b) => diffDays(a.nextDate, today) - diffDays(b.nextDate, today)); // 많이 밀린 것 위로

  if (due.length === 0){
    return '<div class="empty"><div class="big">🎉</div><div class="msg disp">오늘은 쉬는 날이에요</div><div class="sub">해야 할 루틴이 없어요. 푹 쉬세요!</div></div>';
  }

  return due.map(t => {
    const late = -diffDays(t.nextDate, today);
    return `
    <div class="card">
      <div class="top">
        <div class="name">${esc(t.name)}</div>
        ${late > 0 ? `<span class="badge-late">${late}일 밀림</span>` : ""}
        <span class="badge-cat" data-c="${esc(t.category)}">${esc(t.category)}</span>
      </div>
      <div class="cycle">${cycleText(t)} 반복</div>
      <div class="btnrow">
        <button class="b-done" onclick="doComplete('${t.id}')">완료 ✓</button>
        <button class="b-tmrw" onclick="doPostpone('${t.id}',1)">내일로 🌙</button>
        <button class="b-week" onclick="doPostpone('${t.id}',7)">다음 주로</button>
      </div>
    </div>`;
  }).join("");
}

function renderUpcoming(){
  const today = todayStr();
  let html = "";
  let any = false;
  for (let i = 1; i <= 7; i++){
    const day = addDays(today, i);
    const list = tasks.filter(t => t.nextDate === day);
    html += `<div class="day-head"><span class="d disp">${prettyDate(day)}</span><span class="rel">${relLabel(day)}</span></div>`;
    if (list.length === 0){
      html += '<div class="day-none">예정된 일이 없어요</div>';
    }else{
      any = true;
      html += list.map(t => `
        <div class="up-item">
          <span class="nm">${esc(t.name)}</span>
          <span class="badge-cat" data-c="${esc(t.category)}">${esc(t.category)}</span>
        </div>`).join("");
    }
  }
  if (!any && tasks.length === 0){
    return '<div class="empty"><div class="big">📅</div><div class="msg disp">아직 루틴이 없어요</div><div class="sub">관리 탭에서 첫 루틴을 만들어보세요</div></div>';
  }
  return html;
}

function renderManage(){
  let html = '<button class="add-btn" onclick="openSheet()">＋ 새 루틴 추가</button>';
  if (tasks.length === 0){
    html += '<div class="empty"><div class="big">🌱</div><div class="msg disp">첫 루틴을 만들어보세요</div><div class="sub">예: 이틀에 한 번 화분 물주기</div></div>';
    return html;
  }
  const sorted = [...tasks].sort((a, b) => (a.nextDate || "").localeCompare(b.nextDate || ""));
  html += sorted.map(t => `
    <div class="mg-item">
      <div class="row1">
        <span class="nm">${esc(t.name)}</span>
        <span class="badge-cat" data-c="${esc(t.category)}">${esc(t.category)}</span>
      </div>
      <div class="info">${cycleText(t)} 반복 · 다음: ${prettyDate(t.nextDate)} (${relLabel(t.nextDate)})</div>
      <div class="acts">
        <button class="b-edit" onclick="openSheet('${t.id}')">수정</button>
        <button class="b-del" onclick="doDelete('${t.id}')">삭제</button>
      </div>
    </div>`).join("");
  return html;
}

function renderHistory(){
  const today = todayStr();
  const weekAgo = addDays(today, -6);
  const doneCount = logs.filter(l => l.type === "완료" && l.date >= weekAgo && l.date <= today).length;

  let html = `
    <div class="summary">
      <div class="n">${doneCount}개 완료</div>
      <div class="t">최근 7일 동안 해낸 일 · 잘하고 있어요 👏</div>
    </div>`;

  if (logs.length === 0){
    html += '<div class="empty"><div class="big">📖</div><div class="msg disp">아직 기록이 없어요</div><div class="sub">오늘 탭에서 첫 완료를 눌러보세요</div></div>';
    return html;
  }

  const sorted = [...logs].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  html += sorted.slice(0, 100).map(l => `
    <div class="log-item">
      <span class="dt">${l.date ? prettyDate(l.date) : ""}</span>
      <span class="nm">${esc(l.name)}</span>
      <span class="log-type" data-t="${esc(l.type)}">${esc(l.type)}</span>
    </div>`).join("");
  return html;
}

function render(){
  // 헤더
  const now = new Date();
  document.getElementById("headDate").textContent =
    now.getFullYear() + "년 " + (now.getMonth()+1) + "월 " + now.getDate() + "일 (" + DOW[now.getDay()] + ")";
  const titles = {
    today: '오늘의 <b>루틴</b>',
    upcoming: '앞으로 <b>7일</b>',
    manage: '루틴 <b>관리</b>',
    history: '나의 <b>기록</b>'
  };
  document.getElementById("headTitle").innerHTML = titles[tab];

  const main = document.getElementById("main");
  if (loading){
    main.innerHTML = skeletons(3);
    return;
  }
  if (tab === "today") main.innerHTML = renderToday();
  else if (tab === "upcoming") main.innerHTML = renderUpcoming();
  else if (tab === "manage") main.innerHTML = renderManage();
  else main.innerHTML = renderHistory();
}

/* ---------- 탭 ---------- */
document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => {
    tab = b.dataset.tab;
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
    window.scrollTo(0, 0);
    render();
  });
});

/* ---------- 시작 ---------- */
loadAll();

// 자정 넘김 대비: 탭 복귀 시 날짜 갱신
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) render();
});
</script>
</body>
</html>
